<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ben & Anamaria's Bucket List 🌍</title>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Pacifico&family=Nunito:wght@400;700;900&display=swap');
    :root {
      --pink: #ff6eb4; --yellow: #ffe44d; --teal: #00d4c8;
      --purple: #a855f7; --orange: #ff8c42; --bg: #0d0d2b;
    }
    * { margin:0; padding:0; box-sizing:border-box; }
    body { background:var(--bg); font-family:'Nunito',sans-serif; color:white; min-height:100vh; overflow-x:hidden; }
    body::before {
      content:''; position:fixed; inset:0;
      background-image:
        radial-gradient(1px 1px at 10% 20%, white, transparent),
        radial-gradient(1px 1px at 30% 50%, white, transparent),
        radial-gradient(1px 1px at 50% 10%, white, transparent),
        radial-gradient(1px 1px at 70% 70%, white, transparent),
        radial-gradient(1px 1px at 90% 30%, white, transparent),
        radial-gradient(1px 1px at 20% 80%, white, transparent),
        radial-gradient(2px 2px at 45% 45%, rgba(255,255,255,.6), transparent),
        radial-gradient(2px 2px at 15% 60%, rgba(255,255,255,.6), transparent);
      pointer-events:none; z-index:0;
    }
    #root { position:relative; z-index:1; }
    .container { max-width:800px; margin:0 auto; padding:40px 20px 80px; }

    /* Hero */
    .hero { text-align:center; padding:60px 20px 40px; }
    .globe-emoji { font-size:80px; display:block; animation:wobble 4s ease-in-out infinite; margin-bottom:16px; }
    @keyframes wobble { 0%,100%{transform:rotate(-5deg) scale(1);} 25%{transform:rotate(5deg) scale(1.05);} 75%{transform:rotate(4deg) scale(1.05);} }
    .title {
      font-family:'Pacifico',cursive; font-size:clamp(2.2rem,8vw,4rem);
      background:linear-gradient(135deg,var(--pink),var(--yellow),var(--teal),var(--purple));
      -webkit-background-clip:text; -webkit-text-fill-color:transparent; background-clip:text;
      line-height:1.2; margin-bottom:12px;
    }
    .subtitle { font-size:1.2rem; color:rgba(255,255,255,.6); font-weight:700; letter-spacing:3px; text-transform:uppercase; margin-bottom:8px; }
    .tagline { font-size:1rem; color:rgba(255,255,255,.4); margin-bottom:40px; }

    .divider { display:flex; align-items:center; gap:12px; margin:0 auto 40px; max-width:400px; }
    .divider-line { flex:1; height:2px; background:linear-gradient(90deg,transparent,var(--pink),var(--teal),transparent); }

    .counter { text-align:center; margin-bottom:40px; }
    .counter-badge {
      display:inline-block; background:linear-gradient(135deg,var(--purple),var(--pink));
      border-radius:50px; padding:10px 28px; font-size:.9rem; font-weight:900;
      letter-spacing:2px; text-transform:uppercase; box-shadow:0 0 20px rgba(168,85,247,.5);
    }

    /* Items */
    .items { display:flex; flex-direction:column; gap:20px; }
    .item {
      background:rgba(255,255,255,.05); border:2px solid rgba(255,255,255,.1);
      border-radius:20px; padding:28px 32px; display:flex; align-items:flex-start; gap:24px;
      position:relative; overflow:hidden; transition:transform .2s,box-shadow .2s;
      animation:slideIn .4s ease-out;
    }
    @keyframes slideIn { from{opacity:0;transform:translateY(20px);} to{opacity:1;transform:translateY(0);} }
    .item:hover { transform:translateY(-3px) scale(1.01); box-shadow:0 12px 40px rgba(255,110,180,.2); border-color:var(--pink); }
    .item::before { content:''; position:absolute; inset:0; background:linear-gradient(135deg,rgba(255,110,180,.08),rgba(0,212,200,.08)); pointer-events:none; }
    .item-number { font-family:'Pacifico',cursive; font-size:3rem; line-height:1; background:linear-gradient(135deg,var(--yellow),var(--orange)); -webkit-background-clip:text; -webkit-text-fill-color:transparent; background-clip:text; flex-shrink:0; min-width:50px; }
    .item-body { flex:1; }
    .item-emoji { font-size:2rem; margin-bottom:6px; display:block; }
    .item-title { font-size:1.4rem; font-weight:900; color:white; margin-bottom:4px; }
    .item-location { font-size:.9rem; color:var(--teal); font-weight:700; letter-spacing:1px; text-transform:uppercase; }
    .item-status { display:inline-block; margin-top:10px; padding:4px 14px; border-radius:20px; font-size:.75rem; font-weight:900; letter-spacing:1px; text-transform:uppercase; background:rgba(255,228,77,.15); color:var(--yellow); border:1px solid rgba(255,228,77,.3); }

    /* Swipe section */
    .swipe-section { margin-top:50px; }
    .swipe-header { text-align:center; margin-bottom:28px; }
    .swipe-header h2 { font-family:'Pacifico',cursive; font-size:1.8rem; background:linear-gradient(135deg,var(--teal),var(--purple)); -webkit-background-clip:text; -webkit-text-fill-color:transparent; background-clip:text; margin-bottom:8px; }
    .swipe-header p { color:rgba(255,255,255,.4); font-size:.95rem; }

    .stack-info { text-align:center; margin-bottom:16px; }
    .stack-badge { display:inline-block; padding:5px 16px; border-radius:20px; font-size:.8rem; font-weight:900; letter-spacing:1px; text-transform:uppercase; background:rgba(255,255,255,.07); color:rgba(255,255,255,.4); border:1px solid rgba(255,255,255,.1); }

    .swipe-arena {
      position:relative; height:340px;
      display:flex; align-items:center; justify-content:center;
      margin-bottom:24px;
    }

    /* Stacked card effect */
    .stack-card-bg {
      position:absolute; width:100%; max-width:480px;
      background:linear-gradient(145deg,#1a1a3e,#16213e);
      border:2px solid rgba(255,255,255,.08); border-radius:28px;
      pointer-events:none;
    }
    .stack-card-bg.layer-2 { transform:translateY(10px) scale(0.95); z-index:1; opacity:.6; }
    .stack-card-bg.layer-3 { transform:translateY(18px) scale(0.90); z-index:0; opacity:.35; }

    .swipe-card {
      position:absolute; width:100%; max-width:480px;
      background:linear-gradient(145deg,#1a1a3e,#16213e);
      border:2px solid rgba(255,255,255,.12);
      border-radius:28px; padding:36px 32px;
      cursor:grab; user-select:none; touch-action:none;
      box-shadow:0 20px 60px rgba(0,0,0,.5);
      z-index:10; will-change:transform;
    }
    .swipe-card:active { cursor:grabbing; }
    .swipe-card.animating-left { transition:transform .5s ease-in, opacity .5s; transform:translateX(-140%) rotate(-20deg)!important; opacity:0; }
    .swipe-card.animating-right { transition:transform .5s ease-in, opacity .5s; transform:translateX(140%) rotate(20deg)!important; opacity:0; }

    .card-emoji { font-size:3.5rem; display:block; margin-bottom:12px; text-align:center; }
    .card-title { font-family:'Pacifico',cursive; font-size:1.5rem; text-align:center; color:white; margin-bottom:8px; line-height:1.3; }
    .card-location { text-align:center; font-size:.9rem; color:var(--teal); font-weight:700; letter-spacing:1px; text-transform:uppercase; margin-bottom:14px; }
    .card-tagline { text-align:center; font-size:1rem; color:rgba(255,255,255,.65); font-style:italic; line-height:1.5; }

    .card-stamp {
      position:absolute; top:24px;
      font-family:'Nunito',sans-serif; font-size:1.5rem; font-weight:900;
      letter-spacing:3px; text-transform:uppercase;
      padding:6px 16px; border-radius:10px;
      pointer-events:none; transition:opacity .1s;
    }
    .card-stamp.yes { left:20px; color:#4ade80; border:3px solid #4ade80; transform:rotate(-15deg); }
    .card-stamp.nope { right:20px; color:#f87171; border:3px solid #f87171; transform:rotate(15deg); }

    .swipe-buttons { display:flex; justify-content:center; gap:28px; margin-bottom:12px; align-items:center; }
    .btn-nope, .btn-yes {
      width:68px; height:68px; border-radius:50%; border:none; cursor:pointer;
      font-size:1.8rem; display:flex; align-items:center; justify-content:center;
      transition:transform .2s, box-shadow .2s; flex-shrink:0;
    }
    .btn-nope { background:rgba(248,113,113,.15); color:#f87171; border:2px solid rgba(248,113,113,.4); }
    .btn-nope:hover:not(:disabled) { transform:scale(1.12); box-shadow:0 0 20px rgba(248,113,113,.4); }
    .btn-yes { background:rgba(74,222,128,.15); color:#4ade80; border:2px solid rgba(74,222,128,.4); }
    .btn-yes:hover:not(:disabled) { transform:scale(1.12); box-shadow:0 0 20px rgba(74,222,128,.4); }
    .btn-nope:disabled, .btn-yes:disabled { opacity:.3; cursor:not-allowed; }
    .swipe-hint { text-align:center; font-size:.8rem; color:rgba(255,255,255,.2); letter-spacing:1px; }

    .card-loading { display:flex; flex-direction:column; align-items:center; justify-content:center; height:240px; gap:16px; }
    .spinner { width:48px; height:48px; border-radius:50%; border:4px solid rgba(255,255,255,.1); border-top-color:var(--pink); animation:spin .8s linear infinite; }
    @keyframes spin { to{transform:rotate(360deg);} }
    .card-loading p { color:rgba(255,255,255,.4); font-weight:700; font-size:.95rem; }

    /* Manual add */
    .add-section { margin-top:40px; background:rgba(255,255,255,.04); border:2px dashed rgba(255,255,255,.12); border-radius:24px; padding:32px; transition:border-color .2s; }
    .add-section:focus-within { border-color:var(--pink); border-style:solid; }
    .add-title { font-family:'Pacifico',cursive; font-size:1.4rem; margin-bottom:20px; background:linear-gradient(135deg,var(--yellow),var(--orange)); -webkit-background-clip:text; -webkit-text-fill-color:transparent; background-clip:text; }
    .add-form { display:flex; flex-direction:column; gap:14px; }
    .form-row { display:flex; gap:12px; flex-wrap:wrap; }
    .form-field { display:flex; flex-direction:column; gap:6px; flex:1; min-width:150px; }
    .form-field label { font-size:.8rem; font-weight:900; letter-spacing:1px; text-transform:uppercase; color:rgba(255,255,255,.5); }
    .form-field input { background:rgba(255,255,255,.08); border:2px solid rgba(255,255,255,.1); border-radius:12px; padding:12px 16px; color:white; font-family:'Nunito',sans-serif; font-size:1rem; font-weight:700; outline:none; transition:border-color .2s; }
    .form-field input:focus { border-color:var(--pink); }
    .form-field input::placeholder { color:rgba(255,255,255,.25); }
    .btn-add { background:linear-gradient(135deg,var(--pink),var(--purple)); border:none; border-radius:14px; padding:14px 32px; color:white; font-family:'Nunito',sans-serif; font-size:1.1rem; font-weight:900; cursor:pointer; transition:transform .2s,box-shadow .2s,opacity .2s; box-shadow:0 4px 20px rgba(255,110,180,.3); align-self:flex-start; }
    .btn-add:hover:not(:disabled) { transform:translateY(-2px); box-shadow:0 8px 30px rgba(255,110,180,.5); }
    .btn-add:disabled { opacity:.5; cursor:not-allowed; }

    .toast { position:fixed; bottom:30px; left:50%; transform:translateX(-50%) translateY(100px); background:linear-gradient(135deg,var(--teal),var(--purple)); color:white; font-weight:900; padding:14px 28px; border-radius:50px; font-size:1rem; box-shadow:0 8px 30px rgba(0,0,0,.4); transition:transform .4s cubic-bezier(0.175,0.885,0.32,1.275); z-index:100; white-space:nowrap; pointer-events:none; }
    .toast.show { transform:translateX(-50%) translateY(0); }

    .footer { text-align:center; margin-top:60px; color:rgba(255,255,255,.2); font-size:.85rem; font-weight:700; letter-spacing:1px; }
    .confetti { position:fixed; top:0; left:0; width:100%; height:100%; pointer-events:none; z-index:0; overflow:hidden; }
    .dot { position:absolute; border-radius:50%; animation:fall linear infinite; opacity:.6; }
    @keyframes fall { 0%{transform:translateY(-20px) rotate(0deg);opacity:.8;} 100%{transform:translateY(110vh) rotate(720deg);opacity:0;} }

    .empty-state { text-align:center; color:rgba(255,255,255,.3); padding:40px; font-weight:700; }
  </style>
</head>
<body>

<!-- Confetti canvas -->
<div class="confetti" id="confetti-container"></div>
<div id="root"></div>

<script type="text/babel">
const { useState, useEffect, useRef, useCallback } = React;

// ── Confetti ──────────────────────────────────────────────
(function() {
  const el = document.getElementById('confetti-container');
  const colors = ['#ff6eb4','#ffe44d','#00d4c8','#a855f7','#ff8c42'];
  for (let i = 0; i < 30; i++) {
    const d = document.createElement('div');
    d.className = 'dot';
    d.style.left = Math.random() * 100 + '%';
    d.style.background = colors[Math.floor(Math.random() * colors.length)];
    d.style.width = d.style.height = (4 + Math.random() * 8) + 'px';
    d.style.animationDuration = (8 + Math.random() * 14) + 's';
    d.style.animationDelay = (Math.random() * 10) + 's';
    el.appendChild(d);
  }
})();

// ── Helpers ───────────────────────────────────────────────
function escHtml(s) {
  return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function Toast({ msg }) {
  return <div className={`toast ${msg ? 'show' : ''}`}>{msg}</div>;
}

// ── Swipe Card ────────────────────────────────────────────
function SwipeCard({ idea, onSwipeLeft, onSwipeRight, disabled }) {
  const cardRef = useRef(null);
  const drag = useRef({ active: false, startX: 0, currentX: 0 });
  const [stampOpacity, setStampOpacity] = useState({ yes: 0, nope: 0 });
  const [animClass, setAnimClass] = useState('');

  const triggerLeft = useCallback(() => {
    if (disabled || animClass) return;
    setAnimClass('animating-left');
    setTimeout(() => { setAnimClass(''); onSwipeLeft(); }, 500);
  }, [disabled, animClass, onSwipeLeft]);

  const triggerRight = useCallback(() => {
    if (disabled || animClass) return;
    setAnimClass('animating-right');
    setTimeout(() => { setAnimClass(''); onSwipeRight(idea); }, 500);
  }, [disabled, animClass, onSwipeRight, idea]);

  // Drag handlers
  function onStart(x) {
    if (animClass) return;
    drag.current = { active: true, startX: x, currentX: 0 };
  }
  function onMove(x) {
    if (!drag.current.active || animClass) return;
    const dx = x - drag.current.startX;
    drag.current.currentX = dx;
    if (cardRef.current) {
      cardRef.current.style.transition = 'none';
      cardRef.current.style.transform = `translateX(${dx}px) rotate(${dx * 0.07}deg)`;
    }
    setStampOpacity({
      yes: Math.max(0, Math.min(1, dx / 90)),
      nope: Math.max(0, Math.min(1, -dx / 90)),
    });
  }
  function onEnd() {
    if (!drag.current.active) return;
    drag.current.active = false;
    const dx = drag.current.currentX;
    if (cardRef.current) {
      cardRef.current.style.transition = '';
      cardRef.current.style.transform = '';
    }
    setStampOpacity({ yes: 0, nope: 0 });
    if (dx > 100) triggerRight();
    else if (dx < -100) triggerLeft();
  }

  useEffect(() => {
    const mm = (e) => onMove(e.clientX);
    const tm = (e) => onMove(e.touches[0].clientX);
    const up = () => onEnd();
    document.addEventListener('mousemove', mm);
    document.addEventListener('mouseup', up);
    document.addEventListener('touchmove', tm, { passive: true });
    document.addEventListener('touchend', up);
    return () => {
      document.removeEventListener('mousemove', mm);
      document.removeEventListener('mouseup', up);
      document.removeEventListener('touchmove', tm);
      document.removeEventListener('touchend', up);
    };
  });

  if (!idea) return (
    <div className="swipe-card">
      <div className="card-loading">
        <div className="spinner"></div>
        <p>Cooking up something wild...</p>
      </div>
    </div>
  );

  return (
    <div
      ref={cardRef}
      className={`swipe-card ${animClass}`}
      onMouseDown={e => onStart(e.clientX)}
      onTouchStart={e => onStart(e.touches[0].clientX)}
    >
      <span className="card-stamp yes" style={{ opacity: stampOpacity.yes }}>💚 YEP!</span>
      <span className="card-stamp nope" style={{ opacity: stampOpacity.nope }}>❌ NOPE</span>
      <span className="card-emoji">{idea.emoji || '🌍'}</span>
      <div className="card-title">{idea.title}</div>
      <div className="card-location">📍 {idea.location}</div>
      <div className="card-tagline">"{idea.tagline}"</div>
    </div>
  );
}

// ── Swipe Section ─────────────────────────────────────────
function SwipeSection({ onAdd }) {
  const [stack, setStack] = useState([]);
  const [loading, setLoading] = useState(false);
  const [swiping, setSwiping] = useState(false);

  async function fetchBatch() {
    setLoading(true);
    try {
      const res = await fetch('/api/generate?count=10');
      const ideas = await res.json();
      setStack(Array.isArray(ideas) ? ideas : []);
    } catch (e) {
      console.error('Failed to fetch ideas', e);
    } finally {
      setLoading(false);
    }
  }

  useEffect(() => { fetchBatch(); }, []);

  function handleSwipeLeft() {
    setSwiping(false);
    setStack(prev => {
      const next = prev.slice(1);
      if (next.length === 0) fetchBatch();
      return next;
    });
  }

  async function handleSwipeRight(idea) {
    setSwiping(false);
    await onAdd(idea);
    setStack(prev => {
      const next = prev.slice(1);
      if (next.length === 0) fetchBatch();
      return next;
    });
  }

  const current = stack[0] || null;
  const hasNext = stack.length > 1;
  const hasThird = stack.length > 2;
  const remaining = stack.length;

  return (
    <div className="swipe-section">
      <div className="swipe-header">
        <h2>🤖 AI Adventure Generator</h2>
        <p>Swipe right to add it. Swipe left to skip. Let's find something wild.</p>
      </div>

      <div className="stack-info">
        {loading && !current
          ? <span className="stack-badge">⏳ Loading ideas...</span>
          : <span className="stack-badge">
              {remaining > 0 ? `✨ ${remaining} idea${remaining !== 1 ? 's' : ''} in stack` : '🔄 Refreshing...'}
            </span>
        }
      </div>

      <div className="swipe-arena">
        {/* Stack background cards */}
        {hasThird && <div className="stack-card-bg layer-3" style={{ height: '280px' }} />}
        {hasNext && <div className="stack-card-bg layer-2" style={{ height: '280px' }} />}
        {/* Active card */}
        {(current || loading) && (
          <SwipeCard
            key={current?.title || 'loading'}
            idea={loading && !current ? null : current}
            onSwipeLeft={handleSwipeLeft}
            onSwipeRight={handleSwipeRight}
            disabled={loading || swiping}
          />
        )}
      </div>

      <div className="swipe-buttons">
        <button
          className="btn-nope"
          onClick={() => {
            if (!current || loading) return;
            setSwiping(true);
            document.querySelector('.swipe-card')?.classList.add('animating-left');
            setTimeout(() => { document.querySelector('.swipe-card')?.classList.remove('animating-left'); handleSwipeLeft(); setSwiping(false); }, 500);
          }}
          disabled={!current || loading}
          title="Nope"
        >❌</button>
        <button
          className="btn-yes"
          onClick={() => {
            if (!current || loading) return;
            setSwiping(true);
            document.querySelector('.swipe-card')?.classList.add('animating-right');
            setTimeout(() => { document.querySelector('.swipe-card')?.classList.remove('animating-right'); handleSwipeRight(current); setSwiping(false); }, 500);
          }}
          disabled={!current || loading}
          title="Add it!"
        >💚</button>
      </div>
      <p className="swipe-hint">← swipe or use buttons →</p>
    </div>
  );
}

// ── Manual Add Form ───────────────────────────────────────
function AddForm({ onAdd }) {
  const [title, setTitle] = useState('');
  const [emoji, setEmoji] = useState('');
  const [location, setLocation] = useState('');
  const [loading, setLoading] = useState(false);

  async function submit() {
    if (!title.trim()) return;
    setLoading(true);
    await onAdd({ title: title.trim(), emoji: emoji.trim() || '🌍', location: location.trim() });
    setTitle(''); setEmoji(''); setLocation('');
    setLoading(false);
  }

  return (
    <div className="add-section">
      <div className="add-title">✍️ Add your own adventure</div>
      <div className="add-form">
        <div className="form-row">
          <div className="form-field" style={{ flex: 2, minWidth: '200px' }}>
            <label>Adventure *</label>
            <input value={title} onChange={e => setTitle(e.target.value)} onKeyDown={e => e.key === 'Enter' && submit()} type="text" placeholder="e.g. Road trip across Iceland" />
          </div>
          <div className="form-field" style={{ flex: '0 0 80px', minWidth: '80px' }}>
            <label>Emoji</label>
            <input value={emoji} onChange={e => setEmoji(e.target.value)} type="text" placeholder="🌋" maxLength={4} />
          </div>
        </div>
        <div className="form-row">
          <div className="form-field">
            <label>Location</label>
            <input value={location} onChange={e => setLocation(e.target.value)} type="text" placeholder="e.g. Iceland" />
          </div>
        </div>
        <button className="btn-add" onClick={submit} disabled={loading || !title.trim()}>
          {loading ? '✨ Adding...' : '🚀 Add to the list!'}
        </button>
      </div>
    </div>
  );
}

// ── Main App ──────────────────────────────────────────────
function App() {
  const [items, setItems] = useState([]);
  const [toast, setToast] = useState('');
  const toastTimer = useRef(null);

  function showToast(msg) {
    setToast(msg);
    if (toastTimer.current) clearTimeout(toastTimer.current);
    toastTimer.current = setTimeout(() => setToast(''), 3000);
  }

  useEffect(() => {
    fetch('/api/items').then(r => r.json()).then(d => setItems(d.items || [])).catch(() => {});
  }, []);

  async function addItem(idea) {
    try {
      const res = await fetch('/api/items', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ title: idea.title, emoji: idea.emoji, location: idea.location }),
      });
      if (!res.ok) throw new Error();
      const newItem = await res.json();
      setItems(prev => [...prev, newItem]);
      showToast('🎉 Adventure added to the list!');
    } catch (e) {
      showToast('😬 Couldn\'t save — try again!');
    }
  }

  return (
    <div className="container">
      <div className="hero">
        <span className="globe-emoji">🌍</span>
        <h1 className="title">Ben & Anamaria's<br />Bucket List</h1>
        <p className="subtitle">The Official List of Epic Things</p>
        <p className="tagline">Life is short. The world is big. Let's get moving. ✈️</p>
      </div>

      <div className="divider">
        <div className="divider-line"></div>
        <span>🌟</span>
        <div className="divider-line"></div>
      </div>

      <div className="counter">
        <span className="counter-badge">
          🗺️ &nbsp;{items.length} Adventure{items.length !== 1 ? 's' : ''} Locked In &nbsp;🗺️
        </span>
      </div>

      <div className="items">
        {items.length === 0
          ? <div className="empty-state">No adventures yet — add one below! 👇</div>
          : items.map((item, i) => (
            <div key={item.id} className="item">
              <div className="item-number">{i + 1}</div>
              <div className="item-body">
                <span className="item-emoji">{item.emoji || '🌍'}</span>
                <div className="item-title">{item.title}</div>
                {item.location && <div className="item-location">📍 {item.location}</div>}
                <span className="item-status">{item.done ? '✅ Done!' : '⏳ On The List'}</span>
              </div>
            </div>
          ))
        }
      </div>

      <SwipeSection onAdd={addItem} />
      <AddForm onAdd={addItem} />

      <div className="footer">
        <p>Started March 2026 &nbsp;·&nbsp; The world won't explore itself 🚀</p>
      </div>

      <Toast msg={toast} />
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
