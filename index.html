<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ben & Anamaria's Bucket List 🌍</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Pacifico&family=Nunito:wght@400;700;900&display=swap');

    :root {
      --pink: #ff6eb4;
      --yellow: #ffe44d;
      --teal: #00d4c8;
      --purple: #a855f7;
      --orange: #ff8c42;
      --bg: #0d0d2b;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: var(--bg);
      font-family: 'Nunito', sans-serif;
      color: white;
      min-height: 100vh;
      overflow-x: hidden;
    }

    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image:
        radial-gradient(1px 1px at 10% 20%, white, transparent),
        radial-gradient(1px 1px at 30% 50%, white, transparent),
        radial-gradient(1px 1px at 50% 10%, white, transparent),
        radial-gradient(1px 1px at 70% 70%, white, transparent),
        radial-gradient(1px 1px at 90% 30%, white, transparent),
        radial-gradient(1px 1px at 20% 80%, white, transparent),
        radial-gradient(1px 1px at 60% 90%, white, transparent),
        radial-gradient(1px 1px at 80% 15%, white, transparent),
        radial-gradient(2px 2px at 45% 45%, rgba(255,255,255,0.6), transparent),
        radial-gradient(2px 2px at 15% 60%, rgba(255,255,255,0.6), transparent);
      pointer-events: none;
      z-index: 0;
    }

    .container {
      position: relative;
      z-index: 1;
      max-width: 800px;
      margin: 0 auto;
      padding: 40px 20px 80px;
    }

    .hero {
      text-align: center;
      padding: 60px 20px 40px;
    }

    .globe-emoji {
      font-size: 80px;
      display: block;
      animation: wobble 4s ease-in-out infinite;
      margin-bottom: 16px;
    }

    @keyframes wobble {
      0%, 100% { transform: rotate(-5deg) scale(1); }
      25% { transform: rotate(5deg) scale(1.05); }
      50% { transform: rotate(-3deg) scale(1); }
      75% { transform: rotate(4deg) scale(1.05); }
    }

    .title {
      font-family: 'Pacifico', cursive;
      font-size: clamp(2.2rem, 8vw, 4rem);
      background: linear-gradient(135deg, var(--pink), var(--yellow), var(--teal), var(--purple));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      line-height: 1.2;
      margin-bottom: 12px;
    }

    .subtitle {
      font-size: 1.2rem;
      color: rgba(255,255,255,0.6);
      font-weight: 700;
      letter-spacing: 3px;
      text-transform: uppercase;
      margin-bottom: 8px;
    }

    .tagline {
      font-size: 1rem;
      color: rgba(255,255,255,0.4);
      margin-bottom: 40px;
    }

    .divider {
      display: flex;
      align-items: center;
      gap: 12px;
      margin: 0 auto 40px;
      max-width: 400px;
    }
    .divider-line {
      flex: 1;
      height: 2px;
      background: linear-gradient(90deg, transparent, var(--pink), var(--teal), transparent);
    }
    .divider span { font-size: 1.4rem; }

    .counter {
      text-align: center;
      margin-bottom: 40px;
    }
    .counter-badge {
      display: inline-block;
      background: linear-gradient(135deg, var(--purple), var(--pink));
      border-radius: 50px;
      padding: 10px 28px;
      font-size: 0.9rem;
      font-weight: 900;
      letter-spacing: 2px;
      text-transform: uppercase;
      box-shadow: 0 0 20px rgba(168, 85, 247, 0.5);
    }

    .items {
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .item {
      background: rgba(255,255,255,0.05);
      border: 2px solid rgba(255,255,255,0.1);
      border-radius: 20px;
      padding: 28px 32px;
      display: flex;
      align-items: flex-start;
      gap: 24px;
      position: relative;
      overflow: hidden;
      transition: transform 0.2s, box-shadow 0.2s;
      animation: slideIn 0.4s ease-out;
    }

    @keyframes slideIn {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .item:hover {
      transform: translateY(-3px) scale(1.01);
      box-shadow: 0 12px 40px rgba(255,110,180,0.2);
      border-color: var(--pink);
    }

    .item::before {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg, rgba(255,110,180,0.08), rgba(0,212,200,0.08));
      pointer-events: none;
    }

    .item-number {
      font-family: 'Pacifico', cursive;
      font-size: 3rem;
      line-height: 1;
      background: linear-gradient(135deg, var(--yellow), var(--orange));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      flex-shrink: 0;
      min-width: 50px;
    }

    .item-body { flex: 1; }

    .item-emoji {
      font-size: 2rem;
      margin-bottom: 6px;
      display: block;
    }

    .item-title {
      font-size: 1.4rem;
      font-weight: 900;
      color: white;
      margin-bottom: 4px;
    }

    .item-location {
      font-size: 0.9rem;
      color: var(--teal);
      font-weight: 700;
      letter-spacing: 1px;
      text-transform: uppercase;
    }

    .item-status {
      display: inline-block;
      margin-top: 10px;
      padding: 4px 14px;
      border-radius: 20px;
      font-size: 0.75rem;
      font-weight: 900;
      letter-spacing: 1px;
      text-transform: uppercase;
      background: rgba(255,228,77,0.15);
      color: var(--yellow);
      border: 1px solid rgba(255,228,77,0.3);
    }

    /* Add item section */
    .add-section {
      margin-top: 40px;
      background: rgba(255,255,255,0.04);
      border: 2px dashed rgba(255,255,255,0.15);
      border-radius: 24px;
      padding: 32px;
      transition: border-color 0.2s;
    }
    .add-section:focus-within {
      border-color: var(--pink);
      border-style: solid;
    }

    .add-title {
      font-family: 'Pacifico', cursive;
      font-size: 1.5rem;
      margin-bottom: 20px;
      background: linear-gradient(135deg, var(--yellow), var(--orange));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .add-form {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .form-row {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
    }

    .form-field {
      display: flex;
      flex-direction: column;
      gap: 6px;
      flex: 1;
      min-width: 150px;
    }

    .form-field label {
      font-size: 0.8rem;
      font-weight: 900;
      letter-spacing: 1px;
      text-transform: uppercase;
      color: rgba(255,255,255,0.5);
    }

    .form-field input {
      background: rgba(255,255,255,0.08);
      border: 2px solid rgba(255,255,255,0.1);
      border-radius: 12px;
      padding: 12px 16px;
      color: white;
      font-family: 'Nunito', sans-serif;
      font-size: 1rem;
      font-weight: 700;
      outline: none;
      transition: border-color 0.2s;
    }

    .form-field input:focus {
      border-color: var(--pink);
    }

    .form-field input::placeholder {
      color: rgba(255,255,255,0.25);
    }

    .btn-add {
      background: linear-gradient(135deg, var(--pink), var(--purple));
      border: none;
      border-radius: 14px;
      padding: 14px 32px;
      color: white;
      font-family: 'Nunito', sans-serif;
      font-size: 1.1rem;
      font-weight: 900;
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s, opacity 0.2s;
      box-shadow: 0 4px 20px rgba(255,110,180,0.3);
      align-self: flex-start;
    }

    .btn-add:hover:not(:disabled) {
      transform: translateY(-2px);
      box-shadow: 0 8px 30px rgba(255,110,180,0.5);
    }

    .btn-add:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .toast {
      position: fixed;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%) translateY(100px);
      background: linear-gradient(135deg, var(--teal), var(--purple));
      color: white;
      font-weight: 900;
      padding: 14px 28px;
      border-radius: 50px;
      font-size: 1rem;
      box-shadow: 0 8px 30px rgba(0,0,0,0.4);
      transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      z-index: 100;
      white-space: nowrap;
    }
    .toast.show { transform: translateX(-50%) translateY(0); }

    .loading {
      text-align: center;
      padding: 40px;
      color: rgba(255,255,255,0.4);
      font-size: 2rem;
      animation: pulse 1.2s ease-in-out infinite;
    }
    @keyframes pulse { 0%, 100% { opacity: 0.4; } 50% { opacity: 1; } }

    .footer {
      text-align: center;
      margin-top: 60px;
      color: rgba(255,255,255,0.2);
      font-size: 0.85rem;
      font-weight: 700;
      letter-spacing: 1px;
    }

    .confetti {
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      pointer-events: none;
      z-index: 0;
      overflow: hidden;
    }
    .dot {
      position: absolute;
      border-radius: 50%;
      animation: fall linear infinite;
      opacity: 0.6;
    }
    @keyframes fall {
      0% { transform: translateY(-20px) rotate(0deg); opacity: 0.8; }
      100% { transform: translateY(110vh) rotate(720deg); opacity: 0; }
    }
  </style>
</head>
<body>

  <div class="confetti" id="confetti"></div>

  <div class="container">
    <div class="hero">
      <span class="globe-emoji">🌍</span>
      <h1 class="title">Ben & Anamaria's<br>Bucket List</h1>
      <p class="subtitle">The Official List of Epic Things</p>
      <p class="tagline">Life is short. The world is big. Let's get moving. ✈️</p>
    </div>

    <div class="divider">
      <div class="divider-line"></div>
      <span>🌟</span>
      <div class="divider-line"></div>
    </div>

    <div class="counter">
      <span class="counter-badge" id="counter-badge">🗺️ &nbsp;Loading... &nbsp;🗺️</span>
    </div>

    <div class="items" id="items-list">
      <div class="loading">✨</div>
    </div>

    <!-- Add item form -->
    <div class="add-section">
      <div class="add-title">✍️ Add a new adventure</div>
      <div class="add-form">
        <div class="form-row">
          <div class="form-field" style="flex: 2; min-width: 200px;">
            <label>Adventure *</label>
            <input id="input-title" type="text" placeholder="e.g. Road trip across Iceland" />
          </div>
          <div class="form-field" style="flex: 0 0 80px; min-width: 80px;">
            <label>Emoji</label>
            <input id="input-emoji" type="text" placeholder="🌋" maxlength="4" />
          </div>
        </div>
        <div class="form-row">
          <div class="form-field">
            <label>Location</label>
            <input id="input-location" type="text" placeholder="e.g. Iceland" />
          </div>
        </div>
        <button class="btn-add" id="btn-add" onclick="addItem()">🚀 Add to the list!</button>
      </div>
    </div>

    <div class="footer">
      <p>Started March 2026 &nbsp;·&nbsp; The world won't explore itself 🚀</p>
    </div>
  </div>

  <div class="toast" id="toast">🎉 Adventure added!</div>

  <script>
    // Confetti
    const confetti = document.getElementById('confetti');
    const colors = ['#ff6eb4','#ffe44d','#00d4c8','#a855f7','#ff8c42'];
    for (let i = 0; i < 30; i++) {
      const dot = document.createElement('div');
      dot.className = 'dot';
      dot.style.left = Math.random() * 100 + '%';
      dot.style.background = colors[Math.floor(Math.random() * colors.length)];
      dot.style.width = dot.style.height = (4 + Math.random() * 8) + 'px';
      dot.style.animationDuration = (8 + Math.random() * 14) + 's';
      dot.style.animationDelay = (Math.random() * 10) + 's';
      confetti.appendChild(dot);
    }

    // State
    let items = [];

    function renderItems() {
      const list = document.getElementById('items-list');
      const badge = document.getElementById('counter-badge');
      badge.innerHTML = `🗺️ &nbsp;${items.length} Adventure${items.length !== 1 ? 's' : ''} Locked In &nbsp;🗺️`;
      if (items.length === 0) {
        list.innerHTML = '<div style="text-align:center;color:rgba(255,255,255,0.3);padding:40px;font-weight:700;">No adventures yet — add one below! 👇</div>';
        return;
      }
      list.innerHTML = items.map((item, i) => `
        <div class="item">
          <div class="item-number">${i + 1}</div>
          <div class="item-body">
            <span class="item-emoji">${item.emoji || '🌍'}</span>
            <div class="item-title">${escHtml(item.title)}</div>
            ${item.location ? `<div class="item-location">📍 ${escHtml(item.location)}</div>` : ''}
            <span class="item-status">${item.done ? '✅ Done!' : '⏳ On The List'}</span>
          </div>
        </div>
      `).join('');
    }

    function escHtml(s) {
      return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
    }

    async function loadItems() {
      try {
        const res = await fetch('/api/items');
        const data = await res.json();
        items = data.items || [];
        renderItems();
      } catch (e) {
        document.getElementById('items-list').innerHTML = '<div style="text-align:center;color:rgba(255,100,100,0.6);padding:40px;">Couldn\'t load items 😢 Try refreshing!</div>';
      }
    }

    async function addItem() {
      const title = document.getElementById('input-title').value.trim();
      const emoji = document.getElementById('input-emoji').value.trim() || '🌍';
      const location = document.getElementById('input-location').value.trim();
      if (!title) {
        document.getElementById('input-title').focus();
        return;
      }
      const btn = document.getElementById('btn-add');
      btn.disabled = true;
      btn.textContent = '✨ Adding...';
      try {
        const res = await fetch('/api/items', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ title, emoji, location }),
        });
        if (!res.ok) throw new Error('Failed');
        const newItem = await res.json();
        items.push(newItem);
        renderItems();
        document.getElementById('input-title').value = '';
        document.getElementById('input-emoji').value = '';
        document.getElementById('input-location').value = '';
        showToast('🎉 Adventure added to the list!');
      } catch (e) {
        showToast('😬 Something went wrong, try again!');
      } finally {
        btn.disabled = false;
        btn.textContent = '🚀 Add to the list!';
      }
    }

    function showToast(msg) {
      const t = document.getElementById('toast');
      t.textContent = msg;
      t.classList.add('show');
      setTimeout(() => t.classList.remove('show'), 3000);
    }

    // Enter key on title field
    document.getElementById('input-title').addEventListener('keydown', e => {
      if (e.key === 'Enter') addItem();
    });

    loadItems();
  </script>

</body>
</html>
